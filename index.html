<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>피부 관리 설문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141014);--ink:light-dark(#1a1418,#f3ecef);--mut:light-dark(#6b5f65,#b7a9b0);--wine:light-dark(#7a1f3d,#c24a72);--wineD:#5e1530;--blush:light-dark(#fbeef1,#241a1f);--line:light-dark(#e8dbe0,#3a2d33);--coral:#ff6a3d;--panel:light-dark(#ffffff,#1c1519)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip}
.band{padding-block:clamp(20px,3vw,36px);padding-inline:max(5vw,16px)}
.wrap{max-width:860px;margin:0 auto}
header{background:var(--wineD);color:#fff}
header h1{font-size:clamp(28px,4vw,40px);line-height:1.1;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
header p{margin:0;color:#f2d6df;font-size:15px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px}
.tab{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #ffffff55;background:transparent;color:#fff;font:inherit;font-size:15px;cursor:pointer}
.tab[aria-pressed=true]{background:#fff;color:var(--wineD);font-weight:700}
.tg{display:flex;align-items:center;gap:6px;font-size:14px;color:#f7e6ec;min-height:44px;padding:0 6px;cursor:pointer}
.tg input{width:18px;height:18px;accent-color:var(--coral)}
.sp{flex:1}
.prog{height:6px;background:var(--blush);border-radius:3px;overflow:hidden;margin:4px 0 6px}
.prog i{display:block;height:100%;background:var(--coral);transition:width .3s}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,32px);margin-top:14px}
.sec{font-size:13px;color:var(--wine);font-weight:700;margin-bottom:6px}
.q{font-size:clamp(19px,2.4vw,23px);line-height:1.4;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.hint{font-size:14px;color:var(--mut);margin:0 0 16px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg)}
.opt:has(input:checked){border-color:var(--wine);background:var(--blush)}
.opt input{width:20px;height:20px;accent-color:var(--wine);flex:none}
.opt:focus-within{outline:2px solid var(--coral);outline-offset:2px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:13px;text-align:center;line-height:1.3;min-height:72px}
.scale label:has(input:checked){border-color:var(--wine);background:var(--blush);font-weight:700}
.scale input{width:20px;height:20px;accent-color:var(--wine)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:700;color:var(--mut);font-size:13px}
.grid td.c,.grid th.c{text-align:center;width:52px}
.grid input{width:20px;height:20px;accent-color:var(--wine)}
textarea{width:100%;min-height:96px;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.nav{display:flex;gap:10px;margin-top:20px}
.btn{min-height:48px;padding:0 22px;border-radius:24px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.pri{background:var(--wine);border-color:var(--wine);color:#fff;flex:1}
.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.cta{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:16px;border-radius:26px;background:var(--coral);color:#fff;font-weight:700;text-decoration:none;font-size:17px}.cta:focus-visible{outline:2px solid var(--wine);outline-offset:3px}
.err{color:#d23a1a;font-size:14px;min-height:20px;margin-top:8px}
.note{margin-top:16px;padding:12px 14px;border-left:3px solid var(--coral);background:var(--blush);border-radius:0 10px 10px 0;font-size:14px;display:none}
.rv .note{display:block}
.note b{color:var(--wine)}
.concept{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;border:2px solid var(--wine);border-radius:14px;overflow:hidden;margin-bottom:18px}
.concept svg{width:100%;height:100%;min-height:170px;display:block}
.concept .tx{padding:16px 16px 16px 0}
.concept h3{margin:0 0 6px;font-size:20px;line-height:1.3}
.concept p{margin:0;font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:10px;background:var(--wine);color:#fff;margin-bottom:8px}
.price{font-size:clamp(22px,3vw,28px);font-weight:700;margin:6px 0 14px;padding:14px 16px;background:var(--blush);border-radius:12px}
.price s{color:var(--mut);font-weight:400;font-size:.7em;margin-right:8px}
pre{background:var(--blush);padding:12px;border-radius:10px;font-size:13px;max-height:280px;overflow:auto}
.big{font-size:clamp(26px,3.4vw,34px);font-weight:700;line-height:1.2;margin:0 0 8px}
h2{font-size:24px;line-height:1.25;margin:34px 0 10px;letter-spacing:-.01em}
.mx{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:6px;margin-top:12px}
.mx .h{font-size:13px;color:var(--mut);font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px}
.mx .cl{padding:14px;border-radius:12px;min-height:118px}
.mx .cl b{display:block;font-size:17px;margin-bottom:4px}
.mx .cl span{font-size:14px}
.c1{background:var(--wine);color:#fff}.c2{background:var(--blush)}.c3{background:var(--blush)}.c4{border:1px dashed var(--line)}
.vh{writing-mode:vertical-rl;transform:rotate(180deg)}
.pill{white-space:nowrap;font-size:12px;padding:1px 8px;border-radius:9px;border:1px solid var(--line)}
.o1{color:var(--wine);border-color:var(--wine)}.o2{color:#c4461f;border-color:var(--coral)}
ul{padding-left:20px}li{margin:4px 0}
#design{display:none}
@media(max-width:600px){.concept{grid-template-columns:1fr}.concept .tx{padding:0 16px 16px}.concept svg{min-height:130px}table{font-size:13px}th,td{padding:6px 4px}.scale label{font-size:12px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0}.stack td::before{content:attr(data-l);color:var(--mut);font-size:12px;flex:none}}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
<h1>피부 관리와 뷰티 디바이스 설문</h1>
<p>약 8분 · 익명으로 진행되며 이메일·연락처 등 개인정보는 받지 않습니다</p>
</div></header>

<main class="band"><div class="wrap">
<section id="survey">
<div class="prog"><i id="pg" style="width:0"></i></div>
<div class="meta"><span id="pos"></span><span id="eta"></span></div>
<div id="box"></div>
</section>

</div></main>

 {tag:'소개',h:'퇴근 후, 나만의 20분',p:'얼굴에 패치를 붙이고 켜면 20분. 손에 들고 문지를 필요가 없는 패치형 미세전류 뷰티 디바이스입니다. 따뜻한 차 한 잔 마시는 시간, 잠들기 전 시간을 프리미엄 홈 케어 루틴으로 바꿔 보세요.',k:'home'},

function body(q){
 const a=st.a[q.id];
 if(q.t==='single')return `<div class="opts">${q.o.map((x,i)=>`<label class="opt"><input type="radio" name="${q.id}" value="${i}" data-q="${q.id}" ${a===i?'checked':''}>${x}</label>`).join('')}</div>`;
 if(q.t==='multi')return `<div class="opts">${q.o.map((x,i)=>`<label class="opt"><input type="checkbox" value="${i}" data-q="${q.id}" ${Array.isArray(a)&&a.includes(i)?'checked':''}>${x}</label>`).join('')}</div>`;
 if(q.t==='scale')return (q.price?priceBox():'')+radios(q,q.l,q.id,a);
 if(q.t==='text')return `<textarea id="ta_${q.id}" data-q="${q.id}" maxlength="200" placeholder="예: 출근길에 쓸 수 있다는 점이 끌렸어요">${a||''}</textarea>`;
 if(q.t==='info')return '';
 if(q.t==='concept'){const c=CON[st.cell.ord[q.pos]];const g=a||{};
  return `<div class="concept">${art(c.k)}<div class="tx"><span class="tag">${q.pos?'두 번째':'첫 번째'} ${c.tag}</span><h3>${c.h}</h3><p>${c.p}</p></div></div><div class="scroll"><table class="grid"><thead><tr><th></th>${AG.map((x,i)=>`<th class="c">${i+1}</th>`).join('')}</tr></thead><tbody>${CG.map((r,ri)=>`<tr><td>${r}</td>${AG.map((x,i)=>`<td class="c"><input type="radio" aria-label="${r} ${x}" name="${q.id}_${ri}" value="${i}" data-q="${q.id}" data-r="${ri}" ${g[ri]===i?'checked':''}></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="hint" style="margin-top:8px">1 전혀 아니다 · 3 보통 · 5 매우 그렇다</p>`;}
 if(q.t==='bw'){const g=a||{};return `<div class="scroll"><table class="grid"><thead><tr><th>문구</th><th class="c">가장 끌림</th><th class="c">가장 덜 끌림</th></tr></thead><tbody>${MSG.map((m,i)=>`<tr><td>${m}</td><td class="c"><input type="radio" aria-label="가장 끌림 ${m}" name="${q.id}_b" value="${i}" data-q="${q.id}" data-r="b" ${g.b===i?'checked':''}></td><td class="c"><input type="radio" aria-label="가장 덜 끌림 ${m}" name="${q.id}_w" value="${i}" data-q="${q.id}" data-r="w" ${g.w===i?'checked':''}></td></tr>`).join('')}</tbody></table></div>`;}
}

function valid(q){
 const a=st.a[q.id];
 if(q.t==='info'||q.t==='text')return '';
 if(q.t==='single'||q.t==='scale')return a===undefined?'하나를 골라 주세요.':'';
 if(q.t==='multi')return !a||!a.length?'하나 이상 골라 주세요.':'';
 if(q.t==='concept')return !a||Object.keys(a).length<CG.length?'네 문장 모두 응답해 주세요.':'';
 if(q.t==='bw')return !a||a.b===undefined||a.w===undefined?'두 가지 모두 골라 주세요.':a.b===a.w?'같은 문구를 두 번 고를 수 없어요.':'';
}

 let j=st.i+1;while(j<Q.length&&!vis(Q[j]))j++;

  if(q.max&&sel.length>q.max){el.checked=false;sel=sel.filter(x=>x!==v);$('msg').textContent=`최대 ${q.max}개까지 고를 수 있어요.`}else $('msg').textContent='';
  st.a[id]=sel;
 }else if(q.t==='concept'||q.t==='bw'){st.a[id]=Object.assign({},st.a[id],{[el.dataset.r]:v});$('msg').textContent=''}
 else if(q.t!=='text'){st.a[id]=v;$('msg').textContent=''}
});
$('box').addEventListener('input',e=>{const el=e.target;if(el.tagName==='TEXTAREA')st.a[el.dataset.q]=el.value});
$('box').addEventListener('click',e=>{
 const id=e.target.id;
 if(id==='next')next();else if(id==='back')back();else if(id==='reset')reset();
 else if(id==='copy'){navigator.clipboard.writeText($('js').textContent).then(()=>$('msg').textContent='복사했습니다.',()=>$('msg').textContent='복사가 막혀 있어요. 위 텍스트를 직접 선택해 주세요.')}
});
function flat(seg){
 const r={submitted_at:new Date().toISOString(),version:st.cell.ord[0]===0?'A(홈→Whereable)':'B(Whereable→홈)',segment:seg};
 for(const q of Q){const v=st.a[q.id];if(v===undefined||q.t==='info')continue;
  if(q.t==='single')r[q.id]=q.o[v];
  else if(q.t==='multi')r[q.id]=v.map(i=>q.o[i]).join('; ');
  else if(q.t==='scale')r[q.id]=v+1;
  else if(q.t==='text')r[q.id]=v;
  else if(q.t==='concept'){const c=CON[st.cell.ord[q.pos]].k==='home'?'홈':'Whereable';r[q.id+'_소개']=c;CG.forEach((g,ri)=>{if(v[ri]!==undefined)r[q.id+'_'+g]=v[ri]+1})}
  else if(q.t==='bw'){r[q.id+'_best']=MSG[v.b];r[q.id+'_worst']=MSG[v.w]}}
 return r}
function send(seg){
 if(st.sent)return;st.sent=true;const m=$('msg');
 const ok=()=>{m.style.color='inherit';m.textContent='응답이 저장되었습니다.'};
 const fail=()=>{st.sent=false;m.innerHTML='저장에 실패했습니다. 잠시 뒤 <button class="btn" id="retry">다시 보내기</button>'};
 if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(ok).withFailureHandler(fail).saveResponse(flat(seg));return}
 if(!ENDPOINT){m.textContent='[설정 필요] 저장 주소가 없어 이 응답은 저장되지 않았습니다.';return}
 fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(flat(seg))})
  .then(()=>{m.style.color='inherit';m.textContent='응답이 전송되었습니다.'})
  .catch(()=>{st.sent=false;m.innerHTML='전송에 실패했습니다. 네트워크를 확인한 뒤 <button class="btn" id="retry">다시 보내기</button>'});
}
$('box').addEventListener('click',e=>{if(e.target.id==='retry')send(window.__seg)});
render();
}
</script>
